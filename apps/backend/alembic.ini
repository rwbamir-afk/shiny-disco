# Run: uvicorn backend.main:app --host 0.0.0.0 --port 8000
# Environment variables are read from `.env` (see .env.example) or the process env.
# For production, set HOKM_ENVIRONMENT=prod, a strong HOKM_JWT_SECRET, and the
# Telegram bot token matching your Mini App.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite+aiosqlite:///./hokm.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

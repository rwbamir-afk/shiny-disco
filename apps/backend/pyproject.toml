[project]
name = "hokm-backend"
version = "0.1.0"
description = "Telegram Hokm Platform — backend (FastAPI, server-authoritative multiplayer)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "redis>=5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
